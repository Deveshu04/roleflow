name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please remove personal data (names, emails, phone numbers, resume content) and never paste API keys.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Job source / application site
      placeholder: e.g. Greenhouse, Lever, Ashby, LinkedIn Easy Apply, a company careers page
  - type: textarea
    id: timeline
    attributes:
      label: Agent timeline or server log excerpt
      description: The relevant events from the run panel or the terminal running `npm run dev`.
      render: text
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: OS, Node version, browser channel, model
    validations:
      required: true
